services:
  raidguides-landing:
    image: skuldgerry/raidguides-landing:0.1.0
    # Para desenvolvimento local, substitui `image` por:
    # build:
    #   context: ./raidguides-landing
    container_name: raidguides-landing
    restart: unless-stopped
    ports:
      - "3000:8080"

  raidguides-docs:
    image: skuldgerry/raidguides:0.1.0
    # Para desenvolvimento local, substitui `image` por:
    # build:
    #   context: ./raidguides-docs
    container_name: raidguides-docs
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      # No stack privado do Portainer, substitui os valores abaixo pelas
      # credenciais e pelo modelo pretendido. Não os publiques neste repo.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}"

